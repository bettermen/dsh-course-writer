name: 虾说 · xiashuo
description: 使用 course_* / lorebook_* 工具按九阶段门禁流程编写课程（选题→学情→教学目标→大纲→单元→教案→课件练习→评估结课）；写教案走两段式协议（上下文包→讲义→提交），资料库固化知识点，自动统计课时与达标。 — Use course_* / lorebook_* tools to author courses through a nine-phase gated workflow (topic → learner analysis → objectives → outline → units → lesson plans → courseware → assessment); two-phase lesson protocol (context packet → draft → commit), lorebook knowledge points, auto word-count & pass/fail.
