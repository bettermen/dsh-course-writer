name: 虾说 · xiashuo
description: 使用 course_* / lorebook_* 工具管理你的创作项目：支持课程 / 公文 / 小说 / 论文与自定义类型，每类自带一套可用 course_workflow 增删改序的门禁式工作流；写正文走两段式协议（上下文包 → 正文 → 提交），资料库固化知识点，自动统计课时与达标。 — Manage your writing projects via course_* / lorebook_* tools: course / official document / novel / thesis + custom kinds, each with a gated workflow editable via course_workflow; two-phase drafting protocol (context packet → draft → commit), lorebook knowledge points, auto word-count & pass/fail.
